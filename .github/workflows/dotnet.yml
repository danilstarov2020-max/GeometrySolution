name: .NET CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore all
      run: dotnet restore

    - name: Build all
      run: dotnet build --no-restore

    - name: Test all
      run: dotnet test --no-build --verbosity normal