name: .NET CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore GeometryTests/GeometryTests.csproj

    - name: Build
      run: dotnet build GeometryTests/GeometryTests.csproj --no-restore

    - name: Test
      run: dotnet test GeometryTests/GeometryTests.csproj --no-build --verbosity normal